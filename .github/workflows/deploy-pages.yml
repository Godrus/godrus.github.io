# Сборка и деплой на GitHub Pages (ветка gh-pages)
# Сайт: Settings → Pages → Source: Deploy from a branch → Branch: gh-pages, / (root)
# В сборку входит главная страница + раздел /GRStream/ (сборка из репозитория GRStream)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # нужно для пуша в ветку gh-pages
      pages: write
      id-token: write
    steps:
      - name: Checkout godrus.github.io
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Build main site
        run: |
          npm ci
          npm run build

      # GITHUB_TOKEN не имеет доступа к другим репозиториям — нужен PAT (Settings → Secrets → GRSTREAM_ACCESS_TOKEN)
      - name: Checkout GRStream
        uses: actions/checkout@v4
        with:
          repository: Godrus/GRStream
          path: grstream
          token: ${{ secrets.GRSTREAM_ACCESS_TOKEN }}

      - name: Build GRStream client
        run: |
          cd grstream
          npm ci
          npm run build:packages
          npm run build -w client
        env:
          BASE_PATH: /GRStream/

      - name: Add GRStream into build/GRStream/
        run: cp -r grstream/apps/client/dist build/GRStream

      # Секрет GRS_ACCESS_TOKEN (Settings → Secrets) — PAT с доступом к Godrus/GRS
      - name: Checkout GRS
        uses: actions/checkout@v4
        with:
          repository: Godrus/GRS
          path: grs
          token: ${{ secrets.GRS_ACCESS_TOKEN }}

      - name: Build GRS client
        run: |
          cd grs
          npm ci
          npm run build:packages:order
          npm run build
        env:
          BASE_PATH: /GRS/

      - name: Add GRS into build/GRS/
        run: cp -r grs/build build/GRS

      - name: Deploy to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npx gh-pages -d build -r "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" -f
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
